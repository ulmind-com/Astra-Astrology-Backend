[project]
name = "astra-astrology-backend"
version = "0.1.0"
description = "Astra Astrology — FastAPI backend (astrology, numerology & consultation platform)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "beanie>=2.2.0",
    "pymongo>=4.18.0",
    "email-validator>=2.2.0",
    "pyjwt[crypto]>=2.10.0",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "firebase-admin>=6.5.0",
    "python-multipart>=0.0.12",
    "cloudinary>=1.41.0",
    "resend>=2.4.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008", "B904"]

[tool.ruff.lint.per-file-ignores]
# Inline HTML/CSS in email templates reads better unwrapped.
"app/services/email_templates.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli_level = "WARNING"
filterwarnings = ["ignore::DeprecationWarning"]
# The pymongo/firebase loggers are far too chatty at DEBUG.
log_level = "WARNING"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
